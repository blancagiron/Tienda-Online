<!-- views/login.html -->
{% extends "base.html" %}

{% block content %}
<div class="jumbotron-custom-base">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/tienda/">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Inicio de sesión</li>
            </ol>
        </nav>
        <h1 class="display-4">Inicio de sesión</h1>
        <h3 class="text-muted">Bienvenido</h3>
    </div>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Iniciar Sesión</h3>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <form method="POST" action="/tienda/login">
                        <div class="form-group mb-3">
                            <label for="username">Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-ver-producto w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
